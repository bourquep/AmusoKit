name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Test (macOS)
        run: swift test
      - name: Build (iOS)
        run: xcodebuild -scheme AmusoKit -destination 'generic/platform=iOS' build -quiet

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict
